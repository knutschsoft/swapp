[PHP]
; Maximum amount of memory a script may consume
memory_limit = -1
max_execution_time = 90
short_open_tag = Off
upload_max_filesize = 50M
post_max_size = 50M

; Apache+mod_php hat PHP-Errors automatisch in /var/log/apache2/error.log gemischt.
; FrankenPHP (Caddy embed) schreibt Errors sonst nach stderr. Damit der ELK-Stack
; weiter dieselbe Datei liest, PHP-Errors explizit dorthin loggen.
log_errors = On
error_log = /var/log/apache2/error.log

[Date]
; Defines the default timezone used by the date functions
date.timezone="Europe/Berlin"

[Performance Symfony related]
opcache.memory_consumption=256
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
